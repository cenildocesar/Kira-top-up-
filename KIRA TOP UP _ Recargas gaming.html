<!DOCTYPE html><html lang="pt-MZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KIRA TOP UP | Recargas gaming</title>
<style>
:root{--bg:#0B0B12;--bg2:#12121A;--card:#1A1A24;--el:#22222E;--p:#7C3AED;--p2:#A855F7;--b:#2563EB;--t:#F8FAFC;--m:#A1A1AA;--ok:#22C55E;--bad:#EF4444;--warn:#F59E0B;--r:14px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=light]{--bg:#F4F4F8;--bg2:#fff;--card:#fff;--el:#ECECF3;--t:#12121A;--m:#52525B;color-scheme:light}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]):not([data-theme=light]){--bg:#F4F4F8;--bg2:#fff;--card:#fff;--el:#ECECF3;--t:#12121A;--m:#52525B;color-scheme:light}}
*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
.w{max-width:1040px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--el)}
header .w{display:flex;align-items:center;gap:14px;height:56px}
.logo{font-weight:800;letter-spacing:.04em;font-size:19px;margin-right:auto;background:linear-gradient(90deg,var(--p2),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
nav.top{display:none;gap:6px}nav.top button,.ib{background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--m);font-weight:600;min-height:44px}
nav.top button.on,nav.top button:hover{color:var(--t);background:var(--el)}
.ib{display:grid;place-items:center;min-width:44px;background:var(--el);color:var(--t)}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg2);border-top:1px solid var(--el);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bot button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:9px 0 8px;font-size:12px;font-weight:600;color:var(--m);min-height:56px}
nav.bot button.on{color:var(--p2)}
@media(min-width:760px){nav.top{display:flex}nav.bot{display:none}body{padding-bottom:30px}}
.crumb{font-size:13px;color:var(--m);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 4px}
h1{font-size:30px;margin:0 0 4px}h2{font-size:20px;margin:0}h3{margin:0;font-size:17px}
.sub{color:var(--m);margin:0 0 14px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--el);border-radius:var(--r);padding:0 14px;min-height:50px;color:var(--m)}
.search:focus-within{border-color:var(--p2)}.search input{flex:1;background:none;border:0;outline:0;min-width:0;font-size:16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.cats button{flex:none;border:0;background:var(--card);color:var(--m);border-radius:999px;padding:10px 18px;font-weight:700;min-height:44px;transition:.2s}
.cats button.on{background:linear-gradient(135deg,var(--p),var(--b));color:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px;color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.pc{background:var(--card);border:1px solid var(--el);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .2s,border-color .2s;animation:in .3s both}
.pc:hover{transform:translateY(-3px);border-color:var(--p)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.pc .im{aspect-ratio:1/1;background:#000 center/cover;position:relative}
.tag{position:absolute;left:8px;bottom:8px;background:rgba(11,11,18,.85);color:#fff;border:1px solid var(--p);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.pc .bd{padding:12px;display:grid;gap:6px;flex:1}.pc small{color:var(--p2);font-weight:700}
.go{color:var(--m);font-size:14px;border-top:1px solid var(--el);padding-top:8px;margin-top:auto}
.off{opacity:.55}
.empty,.msg{background:var(--card);border-radius:var(--r);padding:24px;text-align:center;color:var(--m)}
.btn{border:0;border-radius:12px;padding:14px 20px;font-weight:700;min-height:48px;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .2s}
.btn:hover{filter:brightness(1.12)}.btn.g{background:var(--el);color:var(--t)}.btn.wa{background:#16a34a}.btn:disabled{opacity:.4;cursor:not-allowed}
.safe{margin:22px 0;padding:14px 16px;border-radius:var(--r);background:var(--card);border-left:4px solid var(--warn);font-size:15px}
.sec{margin:30px 0}
.fa{background:var(--card);border-radius:12px;margin-bottom:8px}.fa summary{padding:14px 16px;font-weight:700;cursor:pointer;min-height:48px}.fa p,.fa ol{margin:0;padding:0 16px 14px;color:var(--m)}.fa ol{padding-left:36px}
.why{display:grid;gap:10px}@media(min-width:700px){.why{grid-template-columns:repeat(3,1fr)}}.why div{background:var(--card);padding:16px;border-radius:var(--r)}.why p{margin:4px 0 0;color:var(--m)}
/* sheet */
#sh{position:fixed;inset:0;z-index:40;display:none;background:rgba(0,0,0,.6)}#sh.on{display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);width:100%;max-width:560px;max-height:94dvh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s}
@media(min-width:760px){#sh.on{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:12px}.hd .im{width:64px;height:64px;border-radius:12px;background:#000 center/cover;flex:none}
.pg{display:flex;gap:6px;margin:8px 0 14px}.pg i{flex:1;height:5px;border-radius:3px;background:var(--el)}.pg i.on{background:var(--p2)}
.pk{display:grid;gap:8px}.po{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid transparent;border-radius:12px;padding:12px 14px;min-height:52px;text-align:left;width:100%;transition:.15s}
.po.sel{border-color:var(--p2);background:color-mix(in srgb,var(--p) 18%,var(--card))}.po b{color:var(--p2)}
.grp{font-size:13px;color:var(--m);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 2px}
label{display:block;font-weight:700;margin:12px 0 6px}
input.f{width:100%;background:var(--card);border:2px solid var(--el);border-radius:12px;padding:13px;font-size:18px;min-height:50px}input.f:focus{border-color:var(--p2);outline:0}
.hint{font-size:14px;min-height:20px;color:var(--m);margin:6px 0}.hint.e{color:var(--bad)}.hint.o{color:var(--ok)}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pm .po{justify-content:center;font-weight:700}
.sum{background:var(--card);border-radius:12px;padding:6px 14px}.sum div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--el)}.sum div:last-child{border:0;font-size:19px;font-weight:800}.sum span{color:var(--m)}
.row{display:flex;gap:10px;margin-top:16px}.row .btn{flex:1}
.al{border-left:4px solid var(--warn);background:var(--card);padding:10px 14px;border-radius:10px;margin:10px 0;font-size:14px}
.ord{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px}.ord header{all:unset}
.st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
.s0{background:#52525B}.s1{background:var(--warn)}.s2{background:var(--b)}.s3{background:var(--p)}.s4{background:var(--ok)}.s5{background:var(--bad)}
.ord dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0;font-size:15px}.ord dt{color:var(--m)}.ord dd{margin:0;text-align:right}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

document.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){C=b.dataset.c;list()}});
var q=Q.trim().toLowerCase(),r=PRODUCTS.filter(function(p){return(C==="todos"||p.cat===C)&&(!q||[p.name,p.cat,p.region,p.method,p.desc].join(" ").toLowerCase().indexOf(q)>-1)});
$("cn").textContent=r.length+(r.length===1?" produto":" produtos");
$("gr").innerHTML=r.length?r.map(function(p){return'<button class="pc'+(p.ok?"":" off")+'" data-i="'+p.id+'" '+(p.ok?"":"disabled")+'><div class="im" style="background-image:url('+p.img+')" role="img" aria-label="'+esc(p.name)+'"><span class="tag">'+esc((p.region?p.region+" · ":"")+p.method)+'</span></div><div class="bd"><h3>'+esc(p.name)+'</h3><small>'+(p.region?"Região "+p.region:CATS.filter(function(c){return c[0]===p.cat})[0][1])+'</small><span class="go">'+(p.ok?"Escolher pacote →":"Indisponível")+'</span></div></button>'}).join(""):
'<div class="empty" style="grid-column:1/-1"><p>'+(C==="gift"&&!q?"Ainda não há gift cards disponíveis.":"Não encontramos produtos correspondentes.")+'</p><button class="btn g" id="cl">Limpar pesquisa</button></div>';
document.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){open_(b.dataset.i)}});
if($("cl"))$("cl").onclick=function(){Q="";C="todos";$("q").value="";list()}}
function pgOrders(){var o=orders();$("app").innerHTML='<div class="crumb">KIRA / Pedidos</div><h1>Meus Pedidos</h1><p class="sub">Os pedidos ficam guardados apenas neste dispositivo e navegador. Não são uma base de dados online; se limpares os dados do navegador, desaparecem.</p>'+
(o.length?o.map(function(x){return'<div class="ord"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>'+esc(x.id)+'</b><span class="st s'+x.st+'">'+STAT[x.st]+'</span></div><dl><dt>Data</dt><dd>'+new Date(x.date).toLocaleString("pt-PT")+'</dd><dt>Produto</dt><dd>'+esc(x.product)+(x.region?" "+esc(x.region):"")+'</dd><dt>ID do jogador</dt><dd>'+esc(x.pid)+'</dd><dt>Pacote</dt><dd>'+esc(x.pack)+'</dd><dt>Pagamento</dt><dd>'+esc(x.pay)+'</dd><dt>Total</dt><dd><b>'+mt(x.total)+'</b></dd></dl><a class="btn g" target="_blank" rel="noopener" href="'+waUrl("Olá, KIRA TOP UP! Preciso de ajuda com o pedido "+x.id)+'">Contactar suporte sobre este pedido</a></div>'}).join(""):'<div class="empty"><p>Ainda não tens pedidos neste dispositivo.</p><button class="btn" onclick="location.hash=\'recargas\'">Ver recargas</button></div>')}
function pgTut(){$("app").innerHTML='<div class="crumb">KIRA / Ajuda</div><h1>Tutoriais</h1><p class="sub">Guias passo a passo.</p>'+TUTS.map(function(t,i){return'<details class="fa"><summary>'+(i+1)+'. '+t[0]+'</summary><ol>'+t[1].map(function(s){return'<li>'+s+'</li>'}).join("")+'</ol></details>'}).join("")}
function pgSup(){$("app").innerHTML='<div class="crumb">KIRA / Ajuda</div><h1>Suporte</h1><p class="sub">'+(CFG.hours?"Atendimento: "+esc(CFG.hours):"Horário de atendimento a definir.")+'</p><a class="btn wa" target="_blank" rel="noopener" href="'+waUrl("Olá, KIRA TOP UP! Preciso de ajuda.")+'">Falar no WhatsApp · +258 87 832 9226</a>'+
'<div class="safe">Nunca partilhes a tua senha ou PIN. O KIRA TOP UP não precisa desses dados para realizar uma recarga.</div><div class="sec"><h2 style="margin-bottom:12px">Perguntas frequentes</h2>'+FAQ.map(function(f){return'<details class="fa"><summary>'+f[0]+'</summary><p>'+f[1]+'</p></details>'}).join("")+'</div><p class="sub">Pagamentos: M-Pesa e e-Mola, coordenados pelo atendimento. Loja independente, não afiliada à Garena.</p>'}
// ===== processo de compra =====
var S={};
function open_(id){var p=PRODUCTS.filter(function(x){return x.id===id})[0];S={p:p,step:0,pack:null,pid:"",pay:"",done:null};draw();$("sh").classList.add("on");document.body.style.overflow="hidden"}
function close_(){$("sh").classList.remove("on");document.body.style.overflow=""}
$("sh").onclick=function(e){if(e.target===this)close_()};
document.addEventListener("keydown",function(e){if(e.key==="Escape")close_()});
function pk(){return S.p.packs.filter(function(k){return k.id===S.pack})[0]}
function validId(v){return/^\d{5,15}$/.test(v)}
function draw(){var p=S.p,h='<div class="hd"><button class="ib" id="bk" aria-label="Voltar">←</button><div class="im" style="background-image:url('+p.img+')"></div><div><h3>'+esc(p.name)+'</h3><span class="sub" style="margin:0">'+esc((p.region?"Região "+p.region+" · ":"")+p.method)+'</span></div></div>';
if(S.done){var o=S.done;$("sc").innerHTML=h+'<div class="msg"><h2 style="color:var(--ok)">Pedido criado</h2><p>'+esc(o.id)+'</p><p>Ainda <b>não</b> há pagamento confirmado. Se o WhatsApp não abriu, usa o botão abaixo e aguarda as instruções.</p></div><div class="row"><a class="btn wa" target="_blank" rel="noopener" href="'+waUrl(msg(o))+'">Abrir WhatsApp</a></div><div class="row"><button class="btn g" id="vo">Meus pedidos</button></div>';
$("bk").onclick=close_;$("vo").onclick=function(){close_();location.hash="pedidos"};return}
h+='<div class="pg">'+[0,1,2,3].map(function(i){return'<i class="'+(i<=S.step?"on":"")+'"></i>'}).join("")+'</div>';
var b="";
if(S.step===0){h+='<p class="sub">1. Escolhe o pacote</p>'+(p.warn?'<div class="al">'+p.warn+'</div>':"");b='<div class="pk">'+p.packs.map(function(k){return k.g?'<div class="grp">'+k.g+'</div>':'<button class="po'+(S.pack===k.id?" sel":"")+'" data-k="'+k.id+'" aria-pressed="'+(S.pack===k.id)+'"><span>'+k.l+(k.d&&k.l.indexOf("diamantes")<0?'<br><small style="color:var(--m)">'+k.d.toLocaleString("pt-PT")+' diamantes</small>':"")+'</span><b>'+mt(k.p)+'</b></button>'}).join("")+'</div>'}
if(S.step===1){h+='<p class="sub">2. ID do jogador</p>';b='<label for="pid">ID do jogador</label><div style="display:flex;gap:8px"><input class="f" id="pid" inputmode="numeric" placeholder="Introduz o teu ID" autocomplete="off" value="'+esc(S.pid)+'"><button class="ib" id="cp" aria-label="Copiar ID">'+ic("c")+'</button></div><p class="hint" id="hi"></p><div class="al">Confirma se o ID está correto antes de continuar. Nunca partilhes a tua senha ou PIN.</div>'}
if(S.step===2){h+='<p class="sub">3. Método de pagamento</p>';b='<div class="pm">'+CFG.pay.map(function(m){return'<button class="po'+(S.pay===m?" sel":"")+'" data-m="'+m+'" aria-pressed="'+(S.pay===m)+'">'+m+'</button>'}).join("")+'</div><p class="hint">O pagamento é coordenado pelo atendimento. Não pedimos PIN, senha nem dados de cartão.</p>'}
if(S.step===3){var k=pk();h+='<p class="sub">4. Revê a encomenda</p>';b='<div class="sum"><div><span>Produto</span><b>'+esc(p.name)+'</b></div>'+(p.region?'<div><span>Região</span><b>'+p.region+'</b></div>':"")+'<div><span>ID do jogador</span><b>'+esc(S.pid)+'</b></div><div><span>Pacote</span><b>'+k.l+'</b></div><div><span>Diamantes</span><b>'+k.d.toLocaleString("pt-PT")+'</b></div><div><span>Pagamento</span><b>'+S.pay+'</b></div><div><span>Total</span><b>'+mt(k.p)+'</b></div></div>'+(p.warn?'<div class="al"><b>'+p.warn+'</b></div>':"")}
var ok=[!!S.pack,validId(S.pid),!!S.pay,true][S.step];
$("sc").innerHTML=h+b+'<div class="row">'+(S.step?'<button class="btn g" id="pv">'+(S.step===3?"Editar pedido":"Voltar")+'</button>':"")+'<button class="btn" id="nx" '+(ok?"":"disabled")+'>'+(S.step===3?"Confirmar encomenda":"Continuar")+'</button></div>';
$("bk").onclick=close_;
document.querySelectorAll("[data-k]").forEach(function(e){e.onclick=function(){S.pack=e.dataset.k;draw()}});
document.querySelectorAll("[data-m]").forEach(function(e){e.onclick=function(){S.pay=e.dataset.m;draw()}});
if($("pid")){var hi=$("hi"),inp=$("pid"),up=function(){inp.value=inp.value.replace(/\D/g,"");S.pid=inp.value;var v=validId(S.pid);hi.className="hint"+(S.pid?(v?" o":" e"):"");hi.textContent=!S.pid?"Apenas números.":v?"Formato válido.":"O ID deve conter apenas números (5 a 15 dígitos).";$("nx").disabled=!v};inp.oninput=up;up();
$("cp").onclick=function(){try{navigator.clipboard.writeText(S.pid);hi.textContent="ID copiado."}catch(e){hi.textContent="Não foi possível copiar."}}}
if($("pv"))$("pv").onclick=function(){S.step--;draw()};
$("nx").onclick=function(){if(S.step<3){S.step++;draw();return}
var k=pk(),o={id:newId(),date:Date.now(),product:S.p.name,region:S.p.region,pid:S.pid,pack:k.l,d:k.d,total:k.p,pay:S.pay,st:1};
var l=orders();l.unshift(o);if(!Store.set("kira.orders",l.slice(0,100)))o.warn=1;
S.done=o;draw();try{window.open(waUrl(msg(o)),"_blank","noopener")}catch(e){}}}
// tema
(function(){var t=Store.get("kira.theme",null);if(t)document.documentElement.dataset.theme=t})();
$("th").onclick=function(){var r=document.documentElement,n=(r.dataset.theme||(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark"))==="dark"?"light":"dark";r.dataset.theme=n;Store.set("kira.theme",n)};
route();
</script></body></html>
